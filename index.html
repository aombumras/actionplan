<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081430">
<title>Action Plan · แผนปฏิบัติงาน หน่วยไตเทียม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700;800&family=Taviraj:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#040a1c; --bg1:#081430; --bg2:#0d1d47; --bg3:#142b66; --bg4:#1c3a85;
  --gold:#d4a73c; --gold-l:#f1d68a; --gold-xl:#fff2c6; --gold-d:#9a7023; --gold-dd:#6e4f17;
  --cream:#fbf6ea; --cream-2:#f3e8cc; --cream-3:#e6d2a0;
  --ink:#14204a; --ink-2:#3a4572; --muted:#8e97b8; --muted-2:#6b7394;
  --line:rgba(212,167,60,.40); --line-2:rgba(212,167,60,.18);
  --ok:#43d39e; --bad:#ff7b7b; --warn:#f5c04a;
  --side:280px; --top:66px;
  --f-th:'Sarabun','Leelawadee UI',Tahoma,sans-serif;
  --f-head:'Taviraj','Sarabun',serif;
  --f-deco:'Cinzel','Taviraj',serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-th);color:#e7ebf7;font-size:15.5px;line-height:1.6;min-height:100vh;
  background:
    radial-gradient(1100px 650px at 55% -12%, rgba(52,94,200,.38), transparent 62%),
    radial-gradient(800px 600px at 105% 105%, rgba(28,58,133,.45), transparent 60%),
    linear-gradient(180deg,#0a1738 0%,#060e26 55%,#040a1c 100%);
  background-attachment:fixed}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(212,167,60,.35)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- stars ---------- */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff6d8;opacity:.0;animation:twinkleStar var(--t,4s) ease-in-out infinite;animation-delay:var(--d,0s);box-shadow:0 0 6px rgba(255,236,180,.8)}
@keyframes twinkleStar{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:var(--o,.7);transform:scale(1)}}

/* ---------- icons ---------- */
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}
.ico .fill{fill:currentColor;stroke:none}
.ico .spin,.ico .spin-rev,.ico .pulse,.ico .twinkle,.ico .lid,.ico .wave{transform-box:fill-box;transform-origin:center}
.ico .spin{animation:spin 10s linear infinite}
.ico .spin-rev{animation:spin 7s linear infinite reverse}
.ico .bounce{animation:bounceY 1.8s var(--ease) infinite}
.ico .bob{animation:bob 2.8s ease-in-out infinite}
.ico .pulse{animation:pulseRing 2.2s ease-out infinite}
.ico .twinkle{animation:twinkle 2.6s ease-in-out infinite}
.ico .bub{animation:bubble 2.4s ease-in infinite}
.ico .bub.b2{animation-delay:.9s}
.ico .ecg{stroke-dasharray:1;stroke-dashoffset:1;animation:ecg 2.6s linear infinite}
.ico .draw{stroke-dasharray:1;stroke-dashoffset:0;animation:drawLoop 3.6s ease-in-out infinite}
.ico .grow{stroke-dasharray:1;animation:drawLoop 3s ease-in-out infinite}
.ico .wave{transform-origin:left center;animation:wave 2.6s ease-in-out infinite}
.ico .lid{transform-origin:15% 100%;transition:transform .3s var(--ease)}
button:hover .ico .lid{transform:rotate(-22deg) translate(-1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounceY{0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(1.8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes pulseRing{0%{transform:scale(.55);opacity:1}80%,100%{transform:scale(1.25);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.75) rotate(0);opacity:.7}50%{transform:scale(1.12) rotate(36deg);opacity:1}}
@keyframes bubble{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-7px);opacity:0}}
@keyframes ecg{to{stroke-dashoffset:-1}}
@keyframes drawLoop{0%{stroke-dashoffset:1}35%,100%{stroke-dashoffset:0}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}

/* ---------- ornaments ---------- */
.orn-strokes{stroke:var(--orn,url(#gGold));stroke-width:2.3}
.orn-fills{fill:var(--orn,url(#gGold))}
.orn-hole{fill:var(--orn-hole,#0a1838)}
.orn-strokes path{stroke-dasharray:1;animation:ornDraw 2.4s var(--ease) both}
@keyframes ornDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dark-orn{--orn:url(#gGoldDark);--orn-hole:#fbf6ea}
.frame{position:relative;border:1px solid var(--line);border-radius:8px;
  background:linear-gradient(180deg,rgba(24,50,116,.55),rgba(9,20,50,.82));
  box-shadow:inset 0 0 0 5px rgba(8,18,46,.75),inset 0 0 0 6px rgba(212,167,60,.22),0 22px 40px -24px rgba(0,0,0,.9)}
.frame>.corner,.paper>.corner,.stage>.corner{position:absolute;width:var(--cs,74px);height:var(--cs,74px);pointer-events:none;z-index:2;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55))}
.corner.tl{left:-7px;top:-7px}
.corner.tr{right:-7px;top:-7px;transform:scaleX(-1)}
.corner.bl{left:-7px;bottom:-7px;transform:scaleY(-1)}
.corner.br{right:-7px;bottom:-7px;transform:scale(-1,-1)}
.paper>.corner{filter:none}
.divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px auto 0;max-width:520px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider::after{background:linear-gradient(90deg,var(--gold),transparent)}
.divider svg{width:min(260px,62vw);height:auto;flex:none}
.dark-orn.divider::before{background:linear-gradient(90deg,transparent,var(--gold-d))}
.dark-orn.divider::after{background:linear-gradient(90deg,var(--gold-d),transparent)}

/* ---------- gold text ---------- */
.gold-text{background:linear-gradient(100deg,#fff4cf 0%,#f1d68a 22%,#c99a35 40%,#fff1bf 52%,#d8ab45 68%,#f6df9c 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:goldShift 7s ease-in-out infinite}
@keyframes goldShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.deco{font-family:var(--f-deco);letter-spacing:.28em;text-transform:uppercase}

/* ---------- layout ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:60;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0c1b44 0%,#081331 55%,#060e27 100%);border-right:1px solid var(--line);
  box-shadow:10px 0 34px -14px rgba(0,0,0,.9);transition:transform .45s var(--ease)}
.sidebar::after{content:'';position:absolute;top:0;bottom:0;right:5px;width:1px;background:linear-gradient(transparent,rgba(212,167,60,.35),transparent)}
.side-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#24407f transparent}
.brand{position:relative;margin:16px 16px 10px;padding:18px 12px 14px;text-align:center;--cs:54px}
.brand .emblem{width:86px;height:86px;display:block;margin:0 auto 6px}
.brand .b-kicker{font-family:var(--f-deco);font-size:13px;letter-spacing:.36em;color:var(--gold-l);margin:2px 0 0}
.brand .b-title{font-family:var(--f-head);font-weight:700;font-size:19px;margin:2px 0 0;line-height:1.35}
.brand .b-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.nav-label{font-family:var(--f-deco);font-size:10px;letter-spacing:.3em;color:var(--gold-d);margin:16px 26px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;margin:3px 12px;border-radius:12px;color:#cdd5ef;text-decoration:none;position:relative;overflow:hidden;cursor:pointer;border:0;background:none;width:calc(100% - 24px);text-align:left;transition:background .3s,color .3s}
.nav-item::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,236,180,.12),transparent);transform:skewX(-18deg);transition:left .6s var(--ease)}
.nav-item:hover::after{left:120%}
.nav-item:hover{background:rgba(212,167,60,.07);color:#fff}
.nav-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none;
  background:radial-gradient(circle at 32% 28%,#1f3f8f,#0a1838 72%);color:var(--gold-l);transition:box-shadow .3s,border-color .3s}
.nav-ico .ico{width:21px;height:21px}
.nav-item .lbl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.nav-item .lbl b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .lbl small{font-family:var(--f-deco);font-size:9.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.nav-item.active{background:linear-gradient(90deg,rgba(212,167,60,.24),rgba(212,167,60,.03));color:#fff}
.nav-item.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:linear-gradient(var(--gold-xl),var(--gold))}
.nav-item.active .nav-ico{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,167,60,.14),0 0 18px rgba(212,167,60,.4)}
.nav-sub{margin:0 12px 4px 64px;display:flex;flex-direction:column;gap:2px}
.nav-sub a{font-size:13.5px;color:var(--muted);text-decoration:none;padding:3px 8px;border-radius:8px;display:flex;gap:8px;align-items:baseline;min-width:0}
.nav-sub a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav-sub a b{font-family:var(--f-deco);color:var(--gold-d);font-size:11px}
.nav-sub a:hover,.nav-sub a.active{color:var(--gold-l);background:rgba(212,167,60,.06)}
.side-foot{padding:12px 14px 16px;border-top:1px solid var(--line-2)}
.user-card{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line-2)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;color:#1b1405;background:linear-gradient(160deg,#fff1c2,#d4a73c 60%,#a57a28);box-shadow:0 0 0 2px rgba(8,18,46,1),0 0 0 3px rgba(212,167,60,.5)}
.user-card .u-name{font-weight:600;font-size:14.5px;line-height:1.2}
.user-card .u-role{font-size:12px;color:var(--muted)}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px;padding:0 4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted-2);box-shadow:0 0 0 3px rgba(255,255,255,.05);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(67,211,158,.18),0 0 10px rgba(67,211,158,.6)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(255,123,123,.18)}
.dot.busy{background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}

.topbar{position:sticky;top:0;z-index:50;height:var(--top);margin-left:var(--side);display:flex;align-items:center;gap:12px;padding:0 22px;
  background:rgba(6,14,38,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line-2)}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(212,167,60,.6),transparent)}
.tb-title{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.tb-title small{font-family:var(--f-deco);font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.tb-title b{font-family:var(--f-head);font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
.clock-pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--gold-l);font-variant-numeric:tabular-nums;background:rgba(212,167,60,.06);font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--gold-l);cursor:pointer;transition:all .25s;flex:none}
.icon-btn:hover{background:rgba(212,167,60,.14);border-color:var(--gold);transform:translateY(-1px)}
.icon-btn.spinning .ico{animation:spin 1s linear infinite}
#menuBtn{display:none}
.main{margin-left:var(--side);position:relative;z-index:1;padding:26px clamp(14px,3vw,34px) 90px;max-width:calc(1320px + var(--side));}
.scrim{position:fixed;inset:0;background:rgba(2,6,20,.6);backdrop-filter:blur(2px);z-index:55;opacity:0;pointer-events:none;transition:opacity .35s}

@media (max-width:1023px){
  .sidebar{transform:translateX(-105%)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .topbar,.main{margin-left:0}
  #menuBtn{display:grid}
}
@media (max-width:560px){
  .topbar{padding:0 12px;gap:8px}
  .clock-pill{display:none}
  body{font-size:15px}
}

/* ---------- page head ---------- */
.page-head{text-align:center;margin:6px 0 22px}
.page-head .kicker{font-family:var(--f-deco);letter-spacing:.42em;color:var(--gold);font-size:clamp(12px,1.6vw,14px)}
.page-head h2{font-family:var(--f-head);font-weight:700;font-size:clamp(24px,3.4vw,34px);margin:2px 0 0;line-height:1.3}
.page-head p{color:var(--muted);margin:6px 0 0}

/* ---------- reveal ---------- */
.reveal{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- stage (hero) ---------- */
.stage{position:relative;text-align:center;padding:22px 16px 26px;border-radius:20px;overflow:hidden;margin-bottom:22px;--cs:84px;
  background:radial-gradient(60% 80% at 50% 0%,rgba(70,118,230,.38),transparent 70%),linear-gradient(180deg,#0f2357 0%,#0a1840 60%,#081333 100%)}
.stage .beam{position:absolute;top:-40px;width:42%;height:120%;background:linear-gradient(180deg,rgba(255,240,200,.16),transparent 75%);filter:blur(6px);transform-origin:top center;pointer-events:none;animation:sway 9s ease-in-out infinite}
.stage .beam.l{left:2%;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);transform:rotate(18deg)}
.stage .beam.r{right:2%;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);transform:rotate(-18deg);animation-delay:-4.5s}
@keyframes sway{0%,100%{opacity:.75}50%{opacity:.35}}
.stage-top{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);position:relative;z-index:1}
.lights{display:flex;gap:clamp(10px,2.6vw,26px);align-items:flex-start;height:72px}
.lights i{display:block;width:4px;border-radius:4px;background:linear-gradient(#fffbe8,#e8c35c);box-shadow:0 0 10px 2px rgba(241,214,138,.75),0 0 26px rgba(241,214,138,.4);animation:flick 4s ease-in-out infinite}
.lights i:nth-child(1){height:58px}.lights i:nth-child(2){height:40px;animation-delay:.6s}.lights i:nth-child(3){height:28px;animation-delay:1.2s}
.lights.r{flex-direction:row-reverse}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.55}50%{opacity:.95}55%{opacity:.6}}
.marquee{position:relative;width:clamp(150px,30vw,200px);aspect-ratio:1.55;border-radius:6px;display:grid;place-items:center;--cs:40px;
  background:linear-gradient(180deg,#fffaf0,#f3e5c0);border:2px solid #e2bf68;box-shadow:0 0 0 4px rgba(10,24,64,1),0 0 0 5px rgba(212,167,60,.55),0 0 40px rgba(241,214,138,.35)}
.marquee .emblem{width:62%;height:auto}
.marquee .corner{width:40px;height:40px;position:absolute}
.podium{width:min(560px,86%);height:46px;margin:-6px auto 0;border-radius:50%;position:relative;z-index:0;
  background:radial-gradient(50% 60% at 50% 40%,#1b3576,#0b1940 70%);box-shadow:inset 0 2px 0 rgba(241,214,138,.25),0 18px 30px -12px rgba(0,0,0,.8)}
.arc{display:block;width:min(820px,100%);height:26px;margin:4px auto 0}
.arc path{stroke:url(#gGoldH);stroke-width:2.4;fill:none;stroke-dasharray:1;animation:ornDraw 2.2s var(--ease) both .3s}
.clock{font-family:var(--f-deco);font-weight:600;font-size:clamp(17px,2.4vw,22px);color:var(--gold-l);font-variant-numeric:tabular-nums;margin:8px 0 6px;letter-spacing:.04em}
.stage h1{font-family:var(--f-deco);font-weight:600;letter-spacing:.32em;font-size:clamp(22px,4.4vw,40px);margin:4px 0 0;line-height:1.2}
.stage .th{font-family:var(--f-head);font-size:clamp(17px,2.4vw,22px);font-weight:600;margin-top:4px}
.stage .org{color:var(--muted);font-size:14.5px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:18px 16px 16px;text-align:center;--cs:44px}
.stat .s-ico{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;color:var(--gold-l);border:1px solid var(--line);
  background:radial-gradient(circle at 30% 28%,#244a9e,#0b1a42 70%);box-shadow:0 0 0 4px rgba(212,167,60,.07),0 0 22px rgba(212,167,60,.18)}
.stat .s-ico .ico{width:26px;height:26px}
.stat .num{font-family:var(--f-deco);font-weight:700;font-size:clamp(28px,4vw,38px);line-height:1.1}
.stat .lab{font-size:14px;color:#cfd6ee}
.stat .en{font-family:var(--f-deco);font-size:9.5px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}

/* ---------- now showing ---------- */
.nowshow{padding:20px clamp(14px,2.6vw,26px) 18px;margin-bottom:26px}
.sec-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-title .badge{font-family:var(--f-deco);font-size:11px;letter-spacing:.24em;color:#14204a;padding:5px 14px;border-radius:999px;background:linear-gradient(180deg,#fbe8ad,#d4a73c);box-shadow:0 0 18px rgba(212,167,60,.35)}
.sec-title h3{margin:0;font-family:var(--f-head);font-size:20px;font-weight:700}
.now-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.now-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line-2);text-decoration:none;transition:border-color .3s,background .3s}
.now-item:hover{border-color:var(--line);background:rgba(212,167,60,.06)}
.now-item .tag{font-family:var(--f-deco);font-weight:700;font-size:13px;color:var(--gold-l);min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(212,167,60,.08)}
.now-item.hidden{display:none}
.now-item .t2{font-size:13px;color:var(--gold-l);line-height:1.45;opacity:.9}
.now-item .t1{margin:4px 0 0;padding-left:18px;font-size:14.5px;line-height:1.5}
.now-item .t1 li::marker{color:var(--gold)}
.sec-count{margin-left:auto;font-size:13px;color:var(--muted)}
.empty{padding:16px;color:var(--muted);text-align:center}

/* ---------- tickets ---------- */
.tickets{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:1180px){.tickets{grid-template-columns:1fr 1fr}}
.t-wrap{filter:drop-shadow(0 16px 22px rgba(0,0,0,.45));transition:transform .4s var(--ease),filter .4s}
.t-wrap:hover{transform:translateY(-4px) scale(1.01);filter:drop-shadow(0 22px 26px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(241,214,138,.25))}
.t-wrap.hot{filter:drop-shadow(0 16px 22px rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(241,214,138,.35))}
.ticket{--stub:124px;position:relative;display:grid;grid-template-columns:var(--stub) 1fr;min-height:158px;border-radius:20px;background:var(--cream);color:var(--ink);text-decoration:none;
  -webkit-mask:radial-gradient(circle at var(--stub) 0,transparent 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at var(--stub) 100%,transparent 14px,#000 14.5px) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle at var(--stub) 0,transparent 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at var(--stub) 100%,transparent 14px,#000 14.5px) bottom/100% 51% no-repeat}
.ticket.hot{box-shadow:inset 0 0 26px rgba(217,178,87,.28)}
.ticket.glow-run{--c1:#d59a26;--c2:#2d8fe0}
.ticket.glow-run::before{padding:2.4px;filter:drop-shadow(0 0 3px var(--c1))}
.ticket .stub{background:linear-gradient(165deg,#f8ecc8 0%,#ecd598 70%,#e3c47c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;border-radius:20px 0 0 20px}
.ticket .stub::after{content:'';position:absolute;inset:8px;border:1px solid rgba(156,112,35,.35);border-radius:14px 4px 4px 14px;pointer-events:none}

.stub-no{font-family:var(--f-deco);font-weight:700;font-size:48px;line-height:1;color:var(--ink)}
.ticket .perf{position:absolute;left:var(--stub);top:16px;bottom:16px;border-left:2px dashed rgba(156,112,35,.5)}
.ticket .tb{padding:18px 20px 18px 24px;position:relative;min-width:0}
.t-kicker{font-family:var(--f-deco);letter-spacing:.2em;font-size:11.5px;color:#6d6488;line-height:1.5;padding-right:48px}
.t-kicker b{font-family:var(--f-th);letter-spacing:.06em;font-weight:600}
.t-title{font-family:var(--f-head);font-weight:700;font-size:clamp(17px,1.9vw,20px);line-height:1.4;margin:4px 0 6px;color:#0f1a40;padding-right:44px}
.t-meta{color:#68708f;font-size:14px}
.t-meta b{color:#1c2a5c}
.t-ico{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#7d5a17;background:radial-gradient(circle at 30% 30%,#fff8e0,#efd99b);border:1px solid rgba(156,112,35,.4)}
.t-ico .ico{width:23px;height:23px}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 16px;border-radius:999px;background:linear-gradient(180deg,#142a63,#0b1a44);color:var(--gold-l);font-family:var(--f-deco);font-size:11.5px;letter-spacing:.2em;box-shadow:0 4px 12px -4px rgba(11,26,68,.6)}
.pill b{font-family:var(--f-th);letter-spacing:.04em;font-weight:600}
.pill .live{width:7px;height:7px;border-radius:50%;background:#5ff0b5;box-shadow:0 0 8px #5ff0b5;animation:blink 1.4s infinite}
.stamp{position:absolute;right:14px;bottom:12px;transform:rotate(-9deg);font-family:var(--f-deco);font-weight:700;letter-spacing:.18em;font-size:13px;color:#b23a3a;border:2px solid #b23a3a;border-radius:6px;padding:2px 10px;opacity:.85}
@media (max-width:520px){
  .ticket{--stub:96px;min-height:146px}

  .stub-lbl{font-size:9.5px}
  .ticket .tb{padding:14px 14px 14px 18px}
  .t-ico{display:none}.t-title,.t-kicker{padding-right:0}

  .pill{padding:6px 14px}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:15px;line-height:1.2;position:relative;overflow:hidden;transition:transform .2s,box-shadow .3s,background .3s;text-decoration:none;white-space:nowrap}
.btn .ico{width:19px;height:19px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn-gold{color:#1d1505;background:linear-gradient(180deg,#fbe9ae 0%,#e3bd5c 48%,#c39232 100%);border-color:#f7dc94;box-shadow:0 8px 20px -10px rgba(212,167,60,.8),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-gold::after{content:'';position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-70%}100%{left:130%}}
.btn-gold:hover{box-shadow:0 10px 26px -8px rgba(212,167,60,.95),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-ghost{color:var(--gold-l);border-color:var(--line);background:rgba(212,167,60,.05)}
.btn-ghost:hover{background:rgba(212,167,60,.14);border-color:var(--gold)}
.btn-navy{color:var(--gold-l);background:linear-gradient(180deg,#183273,#0c1b46);border-color:#2a4790}
.btn-navy:hover{box-shadow:0 8px 20px -10px rgba(12,27,70,.9)}
.btn-line{color:var(--ink);border-color:#d6bf86;background:#fffaf0}
.btn-line:hover{background:#fff3d6}
.btn-danger{color:#fff;background:linear-gradient(180deg,#d65a5a,#a83333);border-color:#e98a8a}
.btn-sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}

/* ---------- plans ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#cfd6ee;cursor:pointer;font-size:14px;transition:all .25s;display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-deco);font-size:12px;color:var(--gold)}
.chip:hover{border-color:var(--line)}
.chip.on{background:linear-gradient(180deg,#fbe8ad,#d4a73c);color:#1a1405;border-color:#f5d98e}
.chip.on b{color:#1a1405}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);min-width:min(100%,260px);flex:0 1 300px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:#fff}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,167,60,.15)}
.group{margin:8px 0 30px}
.group-head{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.g-no{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1;color:#1a1405;font-family:var(--f-deco);font-weight:700;font-size:21px;
  background:radial-gradient(circle at 30% 25%,#fff3c8,#d9ad48 60%,#a97c27);box-shadow:0 0 0 3px #0a1838,0 0 0 4px rgba(212,167,60,.6),0 0 20px rgba(212,167,60,.35)}
.g-no small{display:block;font-size:7px;letter-spacing:.2em;font-weight:600}
.g-txt{min-width:0}
.g-txt .k{font-family:var(--f-deco);letter-spacing:.24em;font-size:11px;color:var(--gold)}
.g-txt h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(17px,2vw,21px);line-height:1.4}
.g-line{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);min-width:20px;align-self:center}
.plan-grid{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:1500px){.plan-grid{grid-template-columns:1fr 1fr}}
.plan{padding:20px clamp(14px,2.4vw,24px) 16px;--cs:62px}
.plan-head{display:flex;gap:12px;align-items:flex-start}
.plan-no{flex:none;font-family:var(--f-deco);font-weight:700;color:var(--gold-l);font-size:13px;letter-spacing:.12em;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(212,167,60,.08);line-height:1.2;text-align:center}
.plan-no small{display:block;font-size:8.5px;letter-spacing:.24em;color:var(--muted)}
.plan-head h4{margin:0;flex:1;font-family:var(--f-head);font-weight:700;font-size:clamp(16px,1.8vw,18.5px);line-height:1.5}
.plan-actions{display:flex;gap:6px;flex:none}
.plan-actions .icon-btn{width:36px;height:36px}
.plan-actions .icon-btn .ico{width:19px;height:19px}
.icon-btn.del:hover{border-color:#e98a8a;color:#ffb4b4;background:rgba(214,90,90,.15)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.meta span{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:#d6dcf2}
.meta .ico{width:16px;height:16px;color:var(--gold-l)}
.sub-h{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-family:var(--f-deco);font-size:10.5px;letter-spacing:.26em;color:var(--gold)}
.sub-h b{font-family:var(--f-th);letter-spacing:.02em;font-size:14px;color:#e7ebf7;font-weight:600}
.sub-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.gantt{--mw:25px;display:grid;gap:6px}
.g-row{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--mw) * 12);gap:12px;align-items:center}
.g-row .a-txt{font-size:14.5px;line-height:1.5;display:flex;gap:8px}
.g-row .a-txt i{font-style:normal;color:var(--gold);font-family:var(--f-deco);font-weight:700;font-size:12.5px;min-width:18px;padding-top:2px}
.months{display:grid;grid-template-columns:repeat(12,1fr);position:relative;height:24px;border-radius:7px;background:rgba(255,255,255,.035);border:1px solid rgba(212,167,60,.12)}
.months .mc{grid-row:1;border-left:1px solid rgba(212,167,60,.08)}
.months .mc:first-child{border-left:0}
.months .mc.now{background:rgba(95,240,181,.08);box-shadow:inset 0 0 0 1px rgba(95,240,181,.25)}
.months .bar{grid-row:1;position:relative;align-self:center;height:8px;margin:0 6px;border-radius:2px;background:linear-gradient(90deg,#f8e3a3,#d4a73c);box-shadow:0 0 10px rgba(241,214,138,.45);transform-origin:left center;animation:barIn .9s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + 200ms)}
.months .bar::before,.months .bar::after{content:'';position:absolute;top:50%;width:0;height:0;border:5px solid transparent;transform:translateY(-50%)}
.months .bar::before{left:-5px;border-right:5px solid #f3d98c;border-left:0}
.months .bar::after{right:-5px;border-left:5px solid #d4a73c;border-right:0}
@keyframes barIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.months.mhead{height:auto;background:none;border:0}
.mhead .mc{border:0;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.3}
.mhead .mc.now{color:#5ff0b5;background:none;box-shadow:none;font-weight:700}
.kpis{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kpis li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.kpis .ico{width:18px;height:18px;color:var(--gold-l);margin-top:3px}
.plan-foot{margin-top:12px;font-size:12px;color:var(--muted);text-align:right}
@media (max-width:600px){
  .group-head{flex-wrap:wrap;gap:10px}
  .g-line{display:none}
  .g-no{width:50px;height:50px;font-size:18px}
  .g-txt{flex:1;min-width:calc(100% - 64px)}
  .group-head .btn{margin-left:auto}
}
@media (max-width:760px){
  .g-row{grid-template-columns:1fr;gap:4px}
  .gantt .g-row.hdr>span:first-child{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chip{flex:none}
  .g-row .months{height:20px}
  .gantt{gap:10px}
  .plan-head{flex-wrap:wrap}
  .plan-head h4{order:3;flex-basis:100%}
  .plan-actions{margin-left:auto}
}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;width:60px;height:60px;border-radius:50%;display:none;place-items:center;border:1px solid #f7dc94;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,#fff3c8,#d9ad48 60%,#a97c27);color:#1a1405;box-shadow:0 0 0 4px rgba(10,24,64,.9),0 0 0 5px rgba(212,167,60,.6),0 12px 28px rgba(0,0,0,.6)}
.fab .ico{width:28px;height:28px;stroke-width:2}
@media (max-width:1023px){.fab.show{display:grid}}

/* ---------- paper / document table ---------- */
.paper{position:relative;background:linear-gradient(180deg,#fffdf6,#fbf4e2);color:var(--ink);border-radius:8px;padding:28px clamp(12px,2.4vw,30px) 26px;--cs:70px;
  box-shadow:0 0 0 1px #e3c97f,0 0 0 6px #0b1a44,0 0 0 7px rgba(212,167,60,.55),0 30px 60px -30px rgba(0,0,0,.9)}
.doc-title{text-align:center;margin-bottom:12px}
.doc-title h3{margin:0;font-family:var(--f-th);font-weight:700;font-size:clamp(16px,2vw,19px)}
.doc-title p{margin:0;font-weight:700;font-size:clamp(14px,1.7vw,16px)}
.doc-scroll{overflow:auto;border:1px solid #cdb67c;border-radius:4px;max-height:none;-webkit-overflow-scrolling:touch}
table.doc{border-collapse:collapse;width:100%;min-width:1120px;font-size:13.5px;line-height:1.45}
table.doc th,table.doc td{border:1px solid #b9a777;padding:5px 7px;vertical-align:top}
table.doc thead th{background:#e9eef8;color:#0d1d47;font-weight:700;text-align:center;vertical-align:middle}
table.doc thead tr:nth-child(2) th{font-size:12px;padding:3px 0;min-width:34px}
table.doc .s-row td{background:#f6ecd0;font-weight:700;color:#0d1d47}
table.doc td.m{padding:0;position:relative;min-width:34px}
table.doc td.m.on{background:rgba(212,167,60,.2)}
table.doc td.m .ln{position:absolute;left:0;right:0;top:14px;height:1.6px;background:#14204a}
table.doc td.m.st .ln{left:5px}
table.doc td.m.en .ln{right:5px}
table.doc td.m .ah{position:absolute;top:10.3px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
table.doc td.m .ah.l{left:0;border-right:6px solid #14204a}
table.doc td.m .ah.r{right:0;border-left:6px solid #14204a}
table.doc .num{white-space:nowrap}
table.doc td.kpi div+div{margin-top:3px}
.doc-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 18px}

/* ---------- settings ---------- */
.set-grid{display:grid;gap:22px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.set-grid{grid-template-columns:1fr}}
.panel{padding:22px clamp(14px,2.4vw,24px) 20px;--cs:58px}
.panel h3{margin:0 0 2px;font-family:var(--f-head);font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center}
.panel h3 .ico{color:var(--gold-l)}
.panel .hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13.5px;color:#cbd3ee;font-weight:500}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:#fff;outline:0;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,167,60,.15)}
textarea.inp{resize:vertical;min-height:44px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.list-ed{display:grid;gap:8px;margin-bottom:12px}
.le-row{display:grid;grid-template-columns:52px 1fr 36px;gap:8px;align-items:start}
.le-row.staff{grid-template-columns:1fr 1.4fr 36px}
.le-row .icon-btn{width:36px;height:40px;border-radius:10px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.url-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,20,.66);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fadeIn .25s both}
.modal-wrap.out{animation:fadeOut .22s both}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.modal{position:relative;width:min(980px,100%);max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;border-radius:10px;color:var(--ink);--cs:70px;
  background:linear-gradient(180deg,#fffdf6,#f8efd8);box-shadow:0 0 0 1px #e3c97f,0 0 0 6px #0b1a44,0 0 0 7px rgba(212,167,60,.6),0 40px 80px -20px rgba(0,0,0,.9);animation:pop .35s var(--ease) both}

.modal.glow-run{--c1:#d29a2a;--c2:#3a8ee0}
.modal.glow-run::before{z-index:4}
@keyframes pop{from{transform:translateY(18px) scale(.97);opacity:0}}
.modal>.corner{position:absolute;width:var(--cs);height:var(--cs);pointer-events:none;z-index:3}
.m-head{padding:22px 26px 6px;text-align:center}
.m-head .deco{font-size:11px;color:var(--gold-d)}
.m-head h3{margin:2px 0 0;font-family:var(--f-head);font-weight:700;font-size:22px;color:#0f1a40}

.m-foot{padding:12px 26px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid #ead9ab}
.modal .field label{color:#3a4572;font-weight:600}
.modal .inp{background:#fffefa;border-color:#dcc58e;color:var(--ink)}
.modal .inp:focus{border-color:#c39232;box-shadow:0 0 0 3px rgba(212,167,60,.25)}
.modal select.inp{appearance:auto}
.ed-grid{display:grid;grid-template-columns:1fr 120px;gap:12px}
.act-ed{border:1px solid #e4cf96;border-radius:12px;padding:10px 12px 12px;background:#fffbf0;margin-bottom:10px;position:relative}
.act-top{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start}
.act-no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-deco);font-weight:700;font-size:13px;color:var(--gold-l);background:linear-gradient(180deg,#183273,#0c1b46);margin-top:4px}
.act-tools{display:flex;gap:4px}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid #dcc58e;background:#fff;display:grid;place-items:center;cursor:pointer;color:#5a4a1f}

.mini .ico{width:16px;height:16px}
.mini.del:hover{background:#ffe1e1;color:#a83333;border-color:#e9a0a0}
.mchips{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:8px}
.mchip{padding:6px 0;border-radius:8px;border:1px solid #dcc58e;background:#fff;font-size:12.5px;cursor:pointer;color:#3a4572;transition:all .15s;user-select:none}
.mchip.on{background:linear-gradient(180deg,#183273,#0c1b46);border-color:#0c1b46;color:var(--gold-l);box-shadow:0 3px 8px -3px rgba(12,27,70,.6)}
.mquick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

@media (max-width:640px){
  .modal-wrap{padding:0;align-items:stretch}

  .mchips{grid-template-columns:repeat(6,minmax(0,1fr))}

}
.resp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}

.rchip.on{background:linear-gradient(180deg,#fbe8ad,#d9ad48);border-color:#c39232;color:#1a1405;font-weight:600}
.err{color:#b23a3a;font-size:13px;margin-top:4px}
.pdf-pages{display:grid;gap:14px}

/* ---------- toast / loader ---------- */
#toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px);pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:12px 18px;border-radius:14px;background:linear-gradient(180deg,#132a66,#0a1840);border:1px solid var(--line);color:#fff;box-shadow:0 18px 40px -16px rgba(0,0,0,.9);animation:toastIn .4s var(--ease) both;pointer-events:auto;font-size:14.5px}
.toast .ico{color:var(--gold-l)}
.toast.bad{border-color:rgba(255,123,123,.6)}.toast.bad .ico{color:var(--bad)}
.toast.out{animation:toastOut .35s both}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
#loader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,#13296a,#050b1f 75%);transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
.ld{text-align:center}
.ld .emblem{width:120px;height:120px;filter:drop-shadow(0 0 22px rgba(241,214,138,.35))}
.ld .ring{animation:spin 6s linear infinite;transform-origin:50px 50px}
.ld p{color:var(--gold-l);font-family:var(--f-deco);letter-spacing:.34em;font-size:13px;margin:16px 0 2px}
.ld small{color:var(--muted)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,123,123,.45);background:rgba(120,30,30,.25);margin-bottom:18px;font-size:14.5px}
.banner .ico{color:var(--bad);margin-top:2px}
.banner b{display:block}

.em-ring{transform-origin:50px 50px;animation:spin 40s linear infinite}
.em-pulse{transform-origin:50px 52px;animation:emPulse 2.6s ease-out infinite}
@keyframes emPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.em-drop{animation:dropFall 2.6s ease-in infinite}
@keyframes dropFall{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}75%{transform:translateY(1px);opacity:1}100%{transform:translateY(3px);opacity:0}}


/* ---------- 3D scene / glow / unfold / tilt ---------- */
#snow{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.kidney-wrap{position:relative;width:min(460px,64vw);height:clamp(270px,31vw,390px);flex:none;display:grid;place-items:center}
.kidney-host{position:absolute;inset:0;z-index:2}
.kidney-cv{width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y;outline:none}
.kidney-cv.grab{cursor:grabbing}
.k-fallback{width:60%;height:auto;margin:auto;position:absolute;inset:0}
.k-glow{position:absolute;left:50%;top:48%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(220,30,60,.30),rgba(220,30,60,.10) 55%,transparent);filter:blur(6px);animation:kPulse 3.6s ease-in-out infinite}
@keyframes kPulse{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
.k-base{position:absolute;left:50%;bottom:2%;width:64%;height:13%;transform:translateX(-50%);border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(241,214,138,.28),rgba(241,214,138,.06) 60%,transparent);box-shadow:0 0 0 1px rgba(241,214,138,.25) inset}
.k-base::after{content:'';position:absolute;inset:18% 14%;border-radius:50%;border:1px solid rgba(241,214,138,.35);animation:kRing 3.6s ease-out infinite}
@keyframes kRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.k-hint{font-size:12.5px;color:var(--muted);margin-top:2px}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.glow-run{--c1:#ffd977;--c2:#6fd8ff}
.glow-run::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;z-index:3;
  background:conic-gradient(from var(--ang),transparent 0deg 40deg,var(--c1) 80deg,transparent 112deg 220deg,var(--c2) 262deg,transparent 292deg 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  filter:drop-shadow(0 0 4px var(--c1)) drop-shadow(0 0 7px rgba(111,216,255,.5));animation:runAng 6.5s linear infinite}
.glow-run.slow::before{animation-duration:10s}
.glow-hover::before{opacity:0;transition:opacity .45s}
.glow-hover:hover::before,.glow-hover:focus-within::before{opacity:1}
@keyframes runAng{to{--ang:360deg}}
.unfold{opacity:0;scale:.94 .16;transform-origin:50% 0;transition:opacity .55s ease,scale .95s cubic-bezier(.2,.9,.25,1.12);transition-delay:var(--ud,0s)}
.unfold.in{opacity:1;scale:1 1}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .28s ease-out;transform-style:preserve-3d}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;opacity:0;transition:opacity .35s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.24),rgba(255,255,255,0) 52%)}
.tilt:hover .glare{opacity:1}
.ticket .glare{background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.6),rgba(255,255,255,0) 50%);mix-blend-mode:soft-light}
@media (min-width:1024px){
  .stat.frame,.nowshow.frame,.plan.frame,.panel.frame{background:linear-gradient(180deg,rgba(24,50,116,.40),rgba(9,20,50,.62));backdrop-filter:blur(10px) saturate(1.25);-webkit-backdrop-filter:blur(10px) saturate(1.25)}
}
.stage.hero3d{background:radial-gradient(55% 65% at 50% 32%,rgba(60,110,230,.22),transparent 72%),linear-gradient(180deg,rgba(15,35,87,.30),rgba(8,19,51,.10));padding-top:26px}
.fx-anchor{width:min(560px,62vw);height:clamp(220px,30vw,330px);flex:none}
.hero3d .lights{align-self:flex-start;margin-top:10px}
.hero3d h1{filter:drop-shadow(0 0 14px rgba(241,214,138,.35))}
.scroll-hint{display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.scroll-hint .mouse{width:22px;height:34px;border:1.6px solid var(--gold);border-radius:12px;position:relative}
.scroll-hint .mouse::after{content:'';position:absolute;left:50%;top:6px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold-l);animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(11px);opacity:0}100%{opacity:0}}
@media (max-width:560px){
  .kidney-wrap{width:calc(100% - 64px);height:280px}
  .hero3d .stage-top{gap:6px}
  .hero3d .lights{gap:7px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .unfold{opacity:1;scale:1 1}
}
@media print{body{background:#fff}}
</style>

}

async function api(action, data) {
  const res = await fetch(S.apiUrl, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, data: data || {} })
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch (e) { throw new Error('Apps Script ตอบกลับไม่ใช่ข้อมูล JSON — ตรวจสอบว่าวาง Code.gs ใหม่และ Deploy เป็นเวอร์ชันใหม่แล้ว (สิทธิ์เข้าถึง: ทุกคน)'); }
  if (!json.ok) throw new Error(json.error || 'เกิดข้อผิดพลาดจาก Google Sheet');
  return json;
}

async function load(silent) {
  setConn('busy', 'กำลังซิงก์กับ Google Sheet…');
  try {
    const d = await api('getAll');
    applyData(d); S.online = true; S.error = '';
    setConn('ok', 'เชื่อมต่อ Google Sheet แล้ว');
    if (!silent) toast('ดึงข้อมูลล่าสุดจาก Google Sheet แล้ว');

  render();
}

/* ---------------- unfold + tilt ---------------- */
let unfoldObs = null;
function observeUnfold(root, quiet) {
  const els = root.querySelectorAll('.unfold:not(.in)');
  if (quiet || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  if (!unfoldObs) unfoldObs = new IntersectionObserver(entries => {
    let k = 0;
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.style.setProperty('--ud', (k++ * .09).toFixed(2) + 's');
      en.target.classList.add('in'); unfoldObs.unobserve(en.target);
    });
  }, { rootMargin: '0px 0px 4% 0px', threshold: .02 });
  els.forEach(e => unfoldObs.observe(e));
}
if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
  let tiltEl = null;
  const resetTilt = el => { el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); };
  document.addEventListener('pointermove', e => {
    const el = e.target.closest ? e.target.closest('.tilt') : null;
    if (tiltEl && tiltEl !== el) resetTilt(tiltEl);
    tiltEl = el; if (!el) return;
    const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    el.style.setProperty('--ry', ((px - .5) * 11).toFixed(2) + 'deg');
    el.style.setProperty('--rx', ((.5 - py) * 9).toFixed(2) + 'deg');
    el.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
    el.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
  }, { passive: true });
}

/* ---------------- modal ---------------- */
function openModal(html, cls = '') {
  const w = document.createElement('div');
  w.className = 'modal-wrap';
  w.innerHTML = `<div class="modal glow-run slow ${cls}" role="dialog" aria-modal="true">${corners(true)}${html}</div>`;
  $('#modalRoot').appendChild(w);
  hydrateIcons(w);
  document.body.style.overflow = 'hidden';
  w.addEventListener('mousedown', e => { if (e.target === w && !w.dataset.busy) closeModal(w); });
  return w;
}
function closeModal(w) {
  w = w || $('#modalRoot .modal-wrap:last-child');
  if (!w) return;
  w.classList.add('out');
  setTimeout(() => { w.remove(); if (!$('#modalRoot .modal-wrap')) document.body.style.overflow = ''; }, 220);
}
function confirmBox(title, msg, okText = 'ยืนยัน', danger) {
  return new Promise(res => {
    const w = openModal(`<div class="m-head"><div class="deco">CONFIRM</div><h3>${esc(title)}</h3></div>${divider(true)}
      <div class="m-body" style="text-align:center">${msg}</div>
      <div class="m-foot"><button class="btn btn-line" data-r="0">ยกเลิก</button><button class="btn ${danger ? 'btn-danger' : 'btn-gold'}" data-r="1">${okText}</button></div>`, 'sm');
    w.dataset.busy = '1';
    w.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { delete w.dataset.busy; closeModal(w); res(b.dataset.r === '1'); } });
  });
}

async function saveEditor(btn) {
  readActsFromDom();
  const f = $('#edForm');
  const title = fv(f, 'title').value.trim();
  $('#errTitle').hidden = !!title;
  if (!title) { fv(f, 'title').focus(); return; }
  const extra = fv(f, 'respExtra').value.split(/\s*[,，、]\s*/).map(s => s.trim()).filter(Boolean);
  const uniq = [...new Set([...ED.resp.filter(r => (S.data.staff || []).some(s => s.name === r)), ...extra])];
  const p = {
    id: ED.p.id, strategyNo: Number(fv(f, 'strategyNo').value), order: Number(fv(f, 'order').value) || 1,
    title, indicators: fv(f, 'indicators').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean).join('\n'),
    budget: fv(f, 'budget').value.trim(), responsible: uniq.join(', '),
    activities: ED.p.activities.filter(a => a.text.trim()).map(a => ({ id: a.id, text: a.text.trim(), months: a.months }))
  };
  const w = $('#editor');
  w.dataset.busy = '1';
  btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก…';
  setConn('busy', 'กำลังบันทึก…');
  try {
    const d = await api('saveProject', p);
    applyData(d); S.online = true; S.error = '';
    setConn('ok', 'เชื่อมต่อ Google Sheet แล้ว');
    delete w.dataset.busy; closeModal(w);
    toast(ED.isNew ? 'เพิ่มแผนงานลง Google Sheet แล้ว' : 'บันทึกการแก้ไขลง Google Sheet แล้ว');
    S._quiet = true; render();
  } catch (err) {
    delete w.dataset.busy; btn.disabled = false; btn.innerHTML = old;
    setConn('bad', 'บันทึกไม่สำเร็จ');
    toast(err.message || String(err), 'bad');
  }
}

/* ---------------- settings actions ---------------- */
async function saveForm(kind, form) {
  const btn = form.querySelector('[type=submit]');
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก…';
  setConn('busy', 'กำลังบันทึก…');
  try {
    let d;
    if (kind === 'unit') {
      const o = {}; ['unitName','fiscalYear','orgLine','headName','headPosition'].forEach(k => o[k] = fv(form, k).value.trim());
      d = await api('saveSettings', o);
    } else if (kind === 'strat') {
      const list = [...form.querySelectorAll('.le-row')].map(r => ({ no: Number(r.querySelector('[name=no]').value), name: r.querySelector('[name=name]').value.trim() })).filter(s => s.name);
      const nos = list.map(s => s.no);
      if (nos.some(n => !n)) throw new Error('กรุณาระบุลำดับยุทธศาสตร์เป็นตัวเลข');
      if (new Set(nos).size !== nos.length) throw new Error('ลำดับยุทธศาสตร์ซ้ำกัน');
      const used = [...new Set((S.data.projects || []).map(p => p.strategyNo))].filter(n => !nos.includes(n));
      if (used.length) throw new Error('ยุทธศาสตร์ที่ ' + used.join(', ') + ' ยังมีแผนงานอยู่ กรุณาย้ายหรือลบแผนงานก่อน');
      d = await api('saveStrategies', { list });
    } else if (kind === 'staff') {
      const list = [...form.querySelectorAll('.le-row')].map(r => ({ name: r.querySelector('[name=name]').value.trim(), position: r.querySelector('[name=position]').value.trim() })).filter(s => s.name);
      d = await api('saveStaff', { list });
    }
    applyData(d); S.online = true; S.error = '';
    setConn('ok', 'เชื่อมต่อ Google Sheet แล้ว');
    toast('บันทึกลง Google Sheet แล้ว');
    S._quiet = true; render();
  } catch (err) {
    btn.disabled = false; btn.innerHTML = old;
    setConn(S.online ? 'ok' : 'bad', S.online ? 'เชื่อมต่อ Google Sheet แล้ว' : 'เชื่อมต่อไม่สำเร็จ');

    hydrateIcons(form);

}

/* =========================================================
   PDF (สร้างบนเครื่องผู้ใช้ ไม่ต้องใช้ไลบรารีภายนอก)
   ========================================================= */
const PDF_FONT = "'Sarabun','Tahoma','Leelawadee UI','Noto Sans Thai','Loma',sans-serif";
const PG = { W: 841.89, H: 595.28, M: 22, S: 2.6, FS: 9, LH: 13, PX: 3.4, PY: 3 };
const segW = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
const segG = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'grapheme' }) : null;
const pfont = (w, s) => `${w} ${s}px ${PDF_FONT}`;

function wrapText(ctx, text, maxW) {
  const out = [];
  String(text == null ? '' : text).split(/\r?\n/).forEach(par => {
    if (!par.trim()) return;
    const words = segW ? Array.from(segW.segment(par), x => x.segment) : par.split(/(\s+)/).filter(Boolean);
    let line = '';
    const pushLong = w => {
      const gs = segG ? Array.from(segG.segment(w), x => x.segment) : Array.from(w);
      for (const g of gs) {
        if (line && ctx.measureText(line + g).width > maxW) { out.push(line); line = g.trimStart(); }
        else line += g;
      }
    };
    for (const w of words) {
      if (!line && !w.trim()) continue;
      if (ctx.measureText(line + w).width <= maxW) { line += w; continue; }
      if (line.trim()) { out.push(line.trimEnd()); line = ''; }
      const ww = w.trimStart();
      if (ctx.measureText(ww).width > maxW) pushLong(ww); else line = ww;
    }
    if (line.trim()) out.push(line.trimEnd());
  });
  return out;
}

function pdfColumns() {
  const CW = PG.W - PG.M * 2;
  const fixed = [['goal', 128], ['act', 178], ['kpi', 172], ['budget', 58], ['resp', 66]];
  const mw = (CW - fixed.reduce((s, c) => s + c[1], 0)) / 12;
  const C = {}; let x = PG.M;
  fixed.forEach(([k, w]) => { C[k] = { x, w }; x += w; });
  C.months = { x, w: mw * 12, mw };
  C.right = x + mw * 12;
  return C;
}

function layoutGroup(ctx, C, p) {
  const { PX } = PG;
  ctx.font = pfont(400, PG.FS);
  const kp = kpiList(p);
  const acts = (p.activities.length ? p.activities : [{ text: '', months: [] }]).map((a, i) => ({
    lines: a.text ? wrapText(ctx, `${i + 1}. ${a.text}`, C.act.w - PX * 2) : [],
    months: MONTHS.map((m, j) => !!(a.months && a.months[j]))
  }));
  return {
    label: `${p.order}. (ต่อ)`,
    goal: wrapText(ctx, `${p.order}. ${p.title}`, C.goal.w - PX * 2),
    kpi: kp.flatMap((k, i) => wrapText(ctx, (kp.length > 1 ? `${i + 1}. ` : '') + k, C.kpi.w - PX * 2)),
    budget: wrapText(ctx, p.budget || '', C.budget.w - PX * 2),
    resp: respList(p).flatMap(r => wrapText(ctx, r, C.resp.w - PX * 2)),
    acts

}
const actH = a => Math.max(1, a.lines.length) * PG.LH + PG.PY * 2;
const spanH = g => Math.max(1, g.goal.length, g.kpi.length, g.budget.length, g.resp.length) * PG.LH + PG.PY * 2;
const groupH = g => Math.max(g.acts.reduce((s, a) => s + actH(a), 0), spanH(g));

function splitGroup(g, avail) {
  const maxLines = Math.floor((avail - PG.PY * 2) / PG.LH);
  if (maxLines < 2) return null;
  let used = 0, k = 0;
  while (k < g.acts.length && used + actH(g.acts[k]) <= avail) { used += actH(g.acts[k]); k++; }
  let headActs = g.acts.slice(0, k), restActs = g.acts.slice(k);
  if (k === 0 && g.acts.length) {
    const a = g.acts[0];
    headActs = [{ lines: a.lines.slice(0, maxLines), months: a.months }];
    restActs = [{ lines: a.lines.slice(maxLines), months: Array(12).fill(false) }, ...g.acts.slice(1)];
  }
  const cut = arr => [arr.slice(0, maxLines), arr.slice(maxLines)];
  const [g1, g2] = cut(g.goal), [k1, k2] = cut(g.kpi), [b1, b2] = cut(g.budget), [r1, r2] = cut(g.resp);
  const head = { label: g.label, goal: g1, kpi: k1, budget: b1, resp: r1, acts: headActs };
  const rest = { label: g.label, goal: g2.length ? g2 : [g.label || '(ต่อ)'], kpi: k2, budget: b2, resp: r2, acts: restActs };
  const restEmpty = !restActs.length && !g2.length && !k2.length && !b2.length && !r2.length;
  return { head, rest: restEmpty ? null : rest };
}

function paginate(ctx, C) {
  const st = settings();
  const TITLE_H = 44, HEAD_H = 30, FOOT = 16;
  const bottom = PG.H - PG.M - FOOT;
  const bodyTop = first => PG.M + (first ? TITLE_H : 0) + HEAD_H;
  const fullAvail = bottom - bodyTop(false);
  const pages = [];
  let cur;
  const newPage = () => { cur = { first: !pages.length, items: [], y: bodyTop(!pages.length) }; pages.push(cur); };
  newPage();
  strategies().forEach(s => {
    ctx.font = pfont(700, PG.FS + .4);
    const sLines = wrapText(ctx, `ยุทธศาสตร์ที่ ${s.no}: ${s.name}`, C.right - PG.M - PG.PX * 2);
    const sh = sLines.length * PG.LH + PG.PY * 2 + 1;
    const groups = projectsOf(s.no).map(p => layoutGroup(ctx, C, p));
    const nextNeed = groups.length ? Math.min(groupH(groups[0]), fullAvail) : 0;
    if (cur.items.length && cur.y + sh + nextNeed > bottom) newPage();
    cur.items.push({ type: 's', lines: sLines, y: cur.y, h: sh }); cur.y += sh;
    groups.forEach(g0 => {
      let g = g0, guard = 0;
      while (g && guard++ < 50) {
        const h = groupH(g);
        if (cur.y + h <= bottom) { cur.items.push({ type: 'g', g, y: cur.y, h }); cur.y += h; g = null; continue; }
        const room = bottom - cur.y;
        if (h <= fullAvail && cur.items.length && cur.items[cur.items.length - 1].type !== 's') {
          // เก็บแผนงานไว้หน้าเดียวกัน ยกเว้นพื้นที่ว่างเหลือมาก จึงแบ่งต่อหน้าถัดไปตามรายการกิจกรรม
          let sp = room >= fullAvail * .3 ? splitGroup(g, room) : null;
          if (sp && sp.rest && sp.rest.acts.length === 1 && sp.head.acts.length >= 3) {
            sp = splitGroup(g, room - actH(sp.head.acts[sp.head.acts.length - 1]) - .5);
          }
          if (sp && sp.head.acts.length >= 2 && sp.rest && sp.rest.acts.length) {
            const hh = groupH(sp.head);
            cur.items.push({ type: 'g', g: sp.head, y: cur.y, h: hh }); cur.y += hh; g = sp.rest; newPage(); continue;
          }
          newPage(); continue;
        }
        if (h <= fullAvail && cur.items.length && cur.items[cur.items.length - 1].type === 's') {
          // หัวยุทธศาสตร์อยู่ท้ายหน้า ย้ายไปหน้าใหม่พร้อมกัน
          const sItem = cur.items.pop(); cur.y -= sItem.h;
          if (!cur.items.length && pages.length > 1) { pages.pop(); cur = pages[pages.length - 1]; }
          newPage(); sItem.y = cur.y; cur.items.push(sItem); cur.y += sItem.h; continue;
        }
        const sp = splitGroup(g, bottom - cur.y);
        if (!sp) { newPage(); continue; }
        const hh = groupH(sp.head);
        cur.items.push({ type: 'g', g: sp.head, y: cur.y, h: hh }); cur.y += hh;
        g = sp.rest; if (g) newPage();
      }
    });
  });
  return { pages: pages.filter(p => p.items.length || p.first), TITLE_H, HEAD_H, bottom };
}

function drawPage(page, idx, total, C, L) {
  const st = settings();
  const cv = document.createElement('canvas');
  cv.width = Math.round(PG.W * PG.S); cv.height = Math.round(PG.H * PG.S);
  const ctx = cv.getContext('2d');
  ctx.scale(PG.S, PG.S);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PG.W, PG.H);
  ctx.textBaseline = 'middle';
  const INK = '#101a3d', GRID = '#59627f', NAVY = '#0d1d47';
  const text = (s, x, y, w, align = 'left') => {
    ctx.textAlign = align;
    ctx.fillText(s, align === 'center' ? x + w / 2 : (align === 'right' ? x + w : x), y);
  };
  let y = PG.M;
  if (page.first) {
    ctx.fillStyle = INK;
    ctx.font = pfont(700, 14); text(`แผนปฏิบัติงานประจำ${st.unitName || ''}`, 0, y + 10, PG.W, 'center');
    ctx.font = pfont(700, 12); text(`ปีงบประมาณ ${st.fiscalYear || ''}   ${st.orgLine || ''}`, 0, y + 28, PG.W, 'center');
    y += L.TITLE_H;
  }
  // table header
  const H1 = 16, H2 = L.HEAD_H - H1, x0 = PG.M, x1 = C.right;
  ctx.fillStyle = '#e7ecf6'; ctx.fillRect(x0, y, x1 - x0, L.HEAD_H);
  ctx.fillStyle = NAVY; ctx.font = pfont(700, PG.FS);
  [['goal', 'เป้าประสงค์/ยุทธศาสตร์'], ['act', 'กิจกรรม'], ['kpi', 'ผลผลิต/ตัวชี้วัด'], ['budget', 'งบประมาณ'], ['resp', 'ผู้รับผิดชอบ']]
    .forEach(([k, t]) => text(t, C[k].x, y + L.HEAD_H / 2, C[k].w, 'center'));
  text('ระยะเวลาดำเนินงาน', C.months.x, y + H1 / 2, C.months.w, 'center');
  ctx.font = pfont(600, 7.6);
  MONTHS.forEach((m, i) => text(m, C.months.x + i * C.months.mw, y + H1 + H2 / 2, C.months.mw, 'center'));
  ctx.strokeStyle = GRID; ctx.lineWidth = .6;
  ctx.strokeRect(x0, y, x1 - x0, L.HEAD_H);
  ['act', 'kpi', 'budget', 'resp', 'months'].forEach(k => line(ctx, C[k].x, y, C[k].x, y + L.HEAD_H));
  line(ctx, C.months.x, y + H1, x1, y + H1);
  for (let i = 1; i < 12; i++) line(ctx, C.months.x + i * C.months.mw, y + H1, C.months.x + i * C.months.mw, y + L.HEAD_H);

  page.items.forEach(it => {
    if (it.type === 's') {
      ctx.fillStyle = '#f6ecd0'; ctx.fillRect(x0, it.y, x1 - x0, it.h);
      ctx.fillStyle = NAVY; ctx.font = pfont(700, PG.FS + .4);
      it.lines.forEach((l, i) => text(l, x0 + PG.PX, it.y + PG.PY + PG.LH * (i + .5) + .5, 0));
      ctx.strokeStyle = GRID; ctx.lineWidth = .6; ctx.strokeRect(x0, it.y, x1 - x0, it.h);
      return;
    }
    drawGroup(ctx, C, it.g, it.y, it.h, INK, GRID, NAVY);
  });
  // footer
  ctx.fillStyle = '#6b7394'; ctx.font = pfont(400, 7.4);
  text(`แผนปฏิบัติงานประจำ${st.unitName || ''} ปีงบประมาณ ${st.fiscalYear || ''} · จัดทำเมื่อ ${thaiDate()}`, x0, PG.H - PG.M + 6, 0);
  text(`หน้า ${idx + 1} / ${total}`, x0, PG.H - PG.M + 6, x1 - x0, 'right');
  return cv;
}
function line(ctx, ax, ay, bx, by) { ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
function drawGroup(ctx, C, g, y, h, INK, GRID, NAVY) {
  const { PX, PY, LH } = PG;
  const x0 = PG.M, x1 = C.right;
  // activity rows
  let ry = y;
  const rows = g.acts.map((a, i) => { let rh = actH(a); if (i === g.acts.length - 1) rh = y + h - ry; const r = { a, y: ry, h: rh }; ry += rh; return r; });
  rows.forEach(r => {
    runs(r.a.months).forEach(([s, e]) => {
      ctx.fillStyle = 'rgba(212,167,60,.24)';
      ctx.fillRect(C.months.x + s * C.months.mw, r.y, (e - s + 1) * C.months.mw, r.h);
    });
  });
  ctx.fillStyle = INK; ctx.font = pfont(400, PG.FS);
  const col = (k, lines) => lines.forEach((l, i) => { ctx.textAlign = 'left'; ctx.fillText(l, C[k].x + PX, y + PY + LH * (i + .5) + .5); });
  col('goal', g.goal); col('kpi', g.kpi); col('budget', g.budget); col('resp', g.resp);
  rows.forEach(r => r.a.lines.forEach((l, i) => { ctx.textAlign = 'left'; ctx.fillText(l, C.act.x + PX, r.y + PY + LH * (i + .5) + .5); }));
  // gantt arrows
  ctx.strokeStyle = NAVY; ctx.fillStyle = NAVY; ctx.lineWidth = 1;
  rows.forEach(r => {
    const cy = r.y + PY + LH * .5 + .5;
    runs(r.a.months).forEach(([s, e]) => {
      const a = C.months.x + s * C.months.mw + 1.6, b = C.months.x + (e + 1) * C.months.mw - 1.6, ah = 2.8, aw = 1.9;
      line(ctx, a + ah - .4, cy, b - ah + .4, cy);
      ctx.beginPath(); ctx.moveTo(a, cy); ctx.lineTo(a + ah, cy - aw); ctx.lineTo(a + ah, cy + aw); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(b, cy); ctx.lineTo(b - ah, cy - aw); ctx.lineTo(b - ah, cy + aw); ctx.closePath(); ctx.fill();
    });
  });
  // grid
  ctx.strokeStyle = GRID; ctx.lineWidth = .6;
  ctx.strokeRect(x0, y, x1 - x0, h);
  ['act', 'kpi', 'budget', 'resp', 'months'].forEach(k => line(ctx, C[k].x, y, C[k].x, y + h));
  for (let i = 1; i < 12; i++) line(ctx, C.months.x + i * C.months.mw, y, C.months.x + i * C.months.mw, y + h);
  ctx.lineWidth = .4; ctx.strokeStyle = '#8a92ab';
  rows.slice(0, -1).forEach(r => { line(ctx, C.act.x, r.y + r.h, C.act.x + C.act.w, r.y + r.h); line(ctx, C.months.x, r.y + r.h, x1, r.y + r.h); });
}

function canvasToJpeg(cv) {
  return new Promise((res, rej) => cv.toBlob(b => b ? b.arrayBuffer().then(buf => res(new Uint8Array(buf))) : rej(new Error('แปลงภาพไม่สำเร็จ')), 'image/jpeg', .92));
